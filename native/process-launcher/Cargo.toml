[package]
name = "ticket-system-process-launcher-foundation"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true
